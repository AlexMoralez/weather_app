@if (errorMessage()) {
  <mat-card class="error-card">
    <mat-card-content>
      <div class="error-content">
        <mat-icon class="error-icon">error</mat-icon>
        <div class="error-text">
          <h3>Oops! Something went wrong</h3>
          <p>{{ errorMessage() }}</p>
        </div>
      </div>
    </mat-card-content>
  </mat-card>
}
